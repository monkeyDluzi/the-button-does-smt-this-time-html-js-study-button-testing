<!DOCTYPE html>
<html>
<head>
    <title>Button Test</title>
</head>
<body>
    <h1>Don't touch the button, it will give an alert</h1>

    <button id="myButton">don't click or i give alert</button>

    <script>
        document.getElementById("myButton").addEventListener("click", function() {
            alert("told you so!");
        });
    </script>

</body>
</html>
