<!DOCTYPE html>
<html>
<head>
    <title>Don't Click Button It Gives Alert</title>
</head>

<body>

    <button id="myButton">
        Don't you click me, I'll give you an alert!
    </button>

    <script>
        document.getElementById("myButton").addEventListener("click", function() {
            alert("Button clicked!");
        });
    </script>

</body>
</html>
